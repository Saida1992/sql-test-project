name: SQL Code Quality Check

on:
  pull_request:
    paths:
      - '**/*.sql'

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SQL Validation Script
        run: |
          python .github/scripts/validate_sql.py
